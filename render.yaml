services:
  - type: web
    name: air-api
    runtime: docker
    plan: free
    healthCheckPath: /live
    envVars:
      - key: DASHBOARD_ORIGIN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
